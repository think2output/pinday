      dongnae: ['동래역사여행', '이색여행', '삼국시대부터 지금의 이름으로 불린 동래 지역은 오랜 시간만큼 부산의 역사를 담고 있다.'],
      haeundae: ['달맞이길/문탠로드', '도보여행', '해운대 삼포 길의 시작점인 달맞이길을 해운대구가 2008년 4월 문탠 로드라는 이름을 내걸고 걷기 코스로 조성하였다.'],
      busanjin: ['화지산 치유숲길', '도보여행', '어린이대공원에서 출발하여 화지산 치유숲을 거쳐 부산 시민공원까지, 초록의 자연을 눈에 담으며…'],
      yeonje: ['배산숲길', '도보여행', '등산 초보인 사람 다 모여라~!'],
      suyeong: ['황령산둘레길', '도보여행', '황령산 허리를 따라 전체 구간을 한 바퀴 도는 자연길, 도심 속에서 삼림욕을 즐길 수 있는 훌륭한 코스다.'],
      saha: ['남파랑길', '도보여행', '누구에게나 문제없는 날은 없고 고민 없는 날도 없다.'],
      seo: ['피란수도길', '도보여행', '1950년 6월 25일 새벽, 기습남침으로 시작된 전쟁.'],
      dong: ['초량이바구길', '도보여행', '부산항을 기준으로 근처에 보이는 산 중턱마다 죄다 빽빽하게 들어서 있는 주택들.'],
      nam: ['이기대해안산책로', '도보여행', '이기대는 남구 용호동의 장산봉 자락 동쪽 바다, 아름다운 해안 암반의 다른 이름이다.'],
      jung: ['남포동 체류기', '이색여행', '평일이건 주말이건 발 디딜 틈 없는 남포동, 이른 아침부터 활력이 넘치는 부산을 제대로 느껴본다.'],
      yeongdo: ['절영해안산책로', '도보여행', '부산하면 떠오르는 바다!']
    };
    const TONES = [
      ['linear-gradient(160deg, #A9BCCB, #6F8798)', '#D8CBB8'],
      ['linear-gradient(160deg, #C9B39A, #8E7560)', '#B7C7D2'],
      ['linear-gradient(160deg, #A8B99C, #6E8360)', '#D9C9B4']
    ];
    const pin = this.props.pin ?? '#FFC94D';
    const glow = (hex, a) => {
      const n = parseInt(String(hex).replace('#', ''), 16);
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const sel = this.state.selected;
    const pinned = sel.length > 0;
    const byId = Object.fromEntries(GU.map((g) => [g.id, g]));
    const toggle = (id) => this.setState((s) => ({ selected: s.selected.includes(id) ? s.selected.filter((x) => x !== id) : [...s.selected, id] }));
    // 지도 그림 시험: 3칸만
    const ICON = { suyeong: 'bridge', yeongdo: 'light', saha: 'houses' };
    const mode = this.props.illust ?? '켜질 때';
    const cells = GU.map((g) => {
      const on = sel.includes(g.id);
      const icon = ICON[g.id];
      const showIcon = !!icon && (mode === '늘 보임' || (mode === '켜질 때' && on));
      return {
        ...g, on,
        showSpot: mode !== '늘 보임' && !showIcon,
        showBridge: showIcon && icon === 'bridge',
        showLight: showIcon && icon === 'light',
        showHouses: showIcon && icon === 'houses',
        iconColor: on ? '#8A5E00' : 'rgba(255,236,190,0.7)',
        pressed: on ? 'true' : 'false',
        label: g.name + ', ' + g.spot + ', 관광지 ' + g.count + '곳',
        cls: on ? 'pd-lit' : '',
        bg: on ? '#FFF8E6' : 'rgba(255,255,255,0.06)',
        shadow: on ? '0 0 40px 10px ' + glow(pin, 0.5) : 'none',
        weight: on ? '800' : '600',
        nameColor: on ? '#111214' : '#E8E9EB',
        spotColor: on ? '#50545B' : '#A3A7AE',
        toggle: () => toggle(g.id),
        enter: () => this.setState({ hover: g.id })
      };
    });
    const hovered = this.state.hover ? byId[this.state.hover] : null;
    let status = '구를 눌러 조명을 켜보세요';
    if (hovered) status = hovered.name + ' — ' + hovered.spot + ' 외 관광지 ' + hovered.count + '곳';
    else if (pinned) status = '조명 켜진 곳 ' + sel.length + ' · ' + sel.map((id) => byId[id].name).join(', ');
    const storyIds = pinned ? sel.slice(0, 3) : ['dong', 'seo', 'nam'];
    return {
      r: (this.props.radius ?? '0') + 'px',
      pin,
      pinGlow: glow(pin, 0.55),
      spotGlow: glow(pin, 0.35),
      room: pinned ? '#0E0F11' : '#17181B',
      lx: Math.round(this.state.lx),
      ly: Math.round(this.state.ly),
      lightR: this.state.lightOn ? 170 : 260,
      cells, status,
      noneSelected: !pinned,
      pinned,
      clear: () => this.setState({ selected: [] }),
      tags: sel.map((id) => ({ name: byId[id].name, label: byId[id].name + ' 선택 해제', remove: () => toggle(id) })),
      startLabel: pinned ? '선택한 ' + sel.length + '곳으로 시작하기' : '부산 전체로 시작하기',
      storyHeading: !pinned ? '이번 주 부산 이야기' : sel.length === 1 ? byId[sel[0]].name + '의 이야기' : '조명 켜진 곳의 이야기',
      stories: storyIds.map((id, i) => ({ gu: byId[id].name, title: STORY[id][0], kind: STORY[id][1], text: STORY[id][2], tone: TONES[i % 3][0], toneB: TONES[i % 3][1] })),
      move: (e) => {
        const el = e.currentTarget;
        const b = el.getBoundingClientRect();
        const scale = b.width / el.offsetWidth || 1;
        this.setState({ lx: (e.clientX - b.left) / scale, ly: (e.clientY - b.top) / scale, lightOn: true });
      },
      leave: () => this.setState({ lightOn: false, hover: null })
    };
  }
}
</script>
</body>
</html>
