<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>PinDay 날씨 대안 · 데스크톱</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111}a:hover{color:#444444}
button{font-family:inherit}
</style>
</helmet>
<div style="font-family: 'Noto Sans KR', sans-serif; color: #111111; background: #FFFFFF; min-height: 100%">

<header style="border-bottom: 1px solid #D4D4D4">
<div style="max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<a href="#" style="display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 900; font-size: 20px">
<span style="width: 28px; height: 28px; border-radius: 50%; background: #111111; display: inline-block" aria-hidden="true"></span>PinDay</a>
<nav aria-label="주요 메뉴" style="display: flex; flex-wrap: wrap; gap: 4px">
<a href="#" style="padding: 10px 16px; border-radius: 999px; text-decoration: none; font-size: 14px">홈</a>
<a href="#" style="padding: 10px 16px; border-radius: 999px; text-decoration: none; font-size: 14px">어디 갈까?</a>
<a href="#" style="padding: 10px 16px; border-radius: 999px; text-decoration: none; font-size: 14px">언제 갈까?</a>
<a href="#" style="padding: 10px 16px; border-radius: 999px; text-decoration: none; font-size: 14px">어떻게 갈까?</a>
<a href="#" aria-current="page" style="padding: 10px 16px; border-radius: 999px; background: #EDEDED; text-decoration: none; font-size: 14px; font-weight: 700">날씨 대안</a>
<a href="#" style="padding: 10px 16px; border-radius: 999px; text-decoration: none; font-size: 14px">AI 도슨트</a>
</nav>
<a href="#" style="padding: 12px 20px; border-radius: 999px; background: #111111; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 700">내 여행 ↗</a>
</div>
</header>

<main style="max-width: 1000px; margin: 0 auto; padding: 24px 24px 48px; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-size: 14px; color: #555555">내 일정의 날씨예요. 일정은 직접 '바꾸기'를 눌렀을 때만 바뀌어요.</p>

<div role="tablist" aria-label="날짜별 날씨" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">
<span style="display: block; font-size: 15px; font-weight: 700">{{t.label}}</span>
<span style="display: block; margin-top: 6px; font-size: 26px">{{t.icon}}</span>
<span style="display: block; margin-top: 4px; font-size: 14px; font-weight: 700">{{t.weather}}</span>
<span style="display: block; margin-top: 2px; font-size: 12px; font-weight: 400">{{t.note}}</span>
</button>
</sc-for>
</div>

<section aria-labelledby="w-day" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="w-day" style="margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -0.02em">{{dayTitle}}</h2>
<p style="margin: 0; padding: 12px 16px; background: #F4F4F4; border-radius: 12px; font-size: 14px">{{dayNote}}</p>
<sc-if value="{{dayEmpty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 24px; border: 1px dashed #BDBDBD; border-radius: 16px; text-align: center; font-size: 14px; color: #444444">이 날은 아직 일정이 없어요</p>
</sc-if>
<sc-for list="{{items}}" as="it" hint-placeholder-count="2">
<div style="border: 1px solid #D4D4D4; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<span style="width: 28px; height: 28px; border-radius: 50%; background: #111111; color: #FFFFFF; display: grid; place-items: center; font-size: 13px; font-weight: 700">{{it.no}}</span>
<strong style="font-size: 17px">{{it.name}}</strong>
<span style="{{it.tagStyle}}">{{it.tag}}</span>
<sc-if value="{{it.swapped}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{it.undo}}" style="margin-left: auto; min-height: 36px; padding: 0 12px; border: 1px solid #BDBDBD; border-radius: 999px; background: #FFFFFF; font-size: 12px; cursor: pointer">되돌리기</button>
</sc-if>
</div>
<sc-if value="{{it.showAlts}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid #E4E4E4">
<p style="margin: 0; font-size: 13px; font-weight: 700">비 예보 · 근처 실내 대안 (이야기 있는 곳 먼저)</p>
<sc-for list="{{it.alts}}" as="a" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: #F4F4F4; border-radius: 14px; flex-wrap: wrap">
<span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 10px; background: #E0E0E0"></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 160px"><strong style="font-size: 15px">{{a.name}}</strong><span style="font-size: 12px; color: #444444">{{a.meta}}</span></span>
<a href="#" style="font-size: 13px; font-weight: 700">▶ 이야기</a>
<button type="button" onClick="{{a.swap}}" style="min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #111111; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer">이 장소로 바꾸기</button>
</div>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</section>
<p style="margin: 0; font-size: 12px; color: #555555">날씨 출처: 기상청 예보 · [발표 시각] 기준 · 바꾼 장소는 날짜와 순서를 그대로 유지해요</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: 1, swaps: {} };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var names = { dongbaek: '동백섬', haeundae: '해운대해수욕장', dalmaji: '해운대 달맞이길', gwangalli: '광안리해수욕장', millak: '민락수변공원' };
    var days = [['dongbaek', 'haeundae', 'dalmaji'], ['gwangalli', 'millak'], []];
    var weather = [
      { icon: '☀', weather: '맑음', note: '[최고 / 최저 기온]', rain: false, pending: false },
      { icon: '☂', weather: '비', note: '강수확률 [N]% · [기온]', rain: true, pending: false },
      { icon: '…', weather: '예보 전', note: '[N]일 전부터 확인돼요', rain: false, pending: true }
    ];
    var dates = ['10.24 (토)', '10.25 (일)', '10.26 (월)'];
    var w = weather[s.active];
    var ids = days[s.active];
    function copySwaps() { var n = {}; for (var k in s.swaps) n[k] = s.swaps[k]; return n; }
    return {
      tabs: dates.map(function (dt, di) {
        var on = di === s.active;
        var wd = weather[di];
        return {
          label: (di + 1) + '일차 · ' + dt, icon: wd.icon, weather: wd.weather, note: wd.note, selected: on ? 'true' : 'false',
          pick: function () { self.setState({ active: di }); },
          style: 'min-height: 140px; border-radius: 18px; cursor: pointer; ' + (on ? 'background: #111111; color: #FFFFFF; border: 1px solid #111111' : 'background: #FFFFFF; color: #111111; border: 1px solid #BDBDBD')
        };
      }),
      dayTitle: (s.active + 1) + '일차 일정',
      dayNote: w.pending ? '아직 예보가 나오지 않았어요. 예보가 나오면 비 소식이 있을 때 알려드릴게요.' : (w.rain ? '비 예보가 있어요. 야외 장소마다 근처 실내 대안을 준비했어요.' : '날씨가 좋아요. 일정 그대로 다녀오세요.'),
      dayEmpty: ids.length === 0,
      items: ids.map(function (id, i) {
        var swapped = s.swaps[id];
        return {
          no: i + 1,
          name: swapped ? swapped : names[id],
          tag: swapped ? '실내 · 바꾼 장소' : '야외',
          tagStyle: 'padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; ' + (swapped ? 'background: #111111; color: #FFFFFF' : 'background: #EDEDED; color: #333333'),
          swapped: !!swapped,
          undo: function () { var n = copySwaps(); delete n[id]; self.setState({ swaps: n }); },
          showAlts: w.rain && !swapped,
          alts: [1, 2].map(function (k) {
            var altName = '[' + names[id] + ' 근처 실내 장소 ' + k + ']';
            return {
              name: altName, meta: '직선 약 [N]km · [분류] · ▶ 이야기 있음',
              swap: function () { var n = copySwaps(); n[id] = altName; self.setState({ swaps: n }); }
            };
          })
        };
      })
    };
  }
}
</script>
</body>
</html>
